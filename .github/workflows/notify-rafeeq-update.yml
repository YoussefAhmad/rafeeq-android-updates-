name: Notify Rafeeq Android users about a new release

on:
  push:
    branches:
      - main
    paths:
      - version.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rafeeq-android-release-notification
  cancel-in-progress: false

jobs:
  notify-devices:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the update manifest
        uses: actions/checkout@v4

      - name: Read Firebase project ID from the service-account secret
        id: project
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const raw = process.env.FIREBASE_SERVICE_ACCOUNT_JSON || '';
          if (!raw) throw new Error('Missing repository secret FIREBASE_SERVICE_ACCOUNT_JSON');
          const account = JSON.parse(raw);
          if (!account.project_id) throw new Error('Firebase service-account JSON has no project_id');
          console.log(`project_id=${account.project_id}`);
          NODE

      - name: Authenticate to Firebase Cloud Messaging
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_lifetime: 300s

      - name: Validate version.json and build FCM payload
        id: manifest
        shell: bash
        env:
          FIREBASE_PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('version.json', 'utf8'));
          const version = String(manifest.latestVersion ?? manifest.latest_version ?? manifest.version ?? manifest.appVersion ?? '').trim().replace(/^[vV]/, '');
          const apkUrl = String(manifest.apkUrl ?? manifest.directApkUrl ?? manifest.downloadUrl ?? '').trim();
          const updateUrl = String(manifest.updateUrl ?? manifest.releasePageUrl ?? manifest.releaseUrl ?? '').trim();
          if (!/^\d+(\.\d+){1,3}([+-][0-9A-Za-z.-]+)?$/.test(version)) throw new Error('version.json must contain a valid latestVersion, e.g. 1.0.2');
          if (!/^https:\/\//i.test(apkUrl) || !/\.apk(?:$|\?)/i.test(apkUrl)) throw new Error('version.json apkUrl must be an HTTPS URL ending in .apk');
          if (!/^https:\/\//i.test(updateUrl)) throw new Error('version.json updateUrl/releasePageUrl must be HTTPS');
          if (!process.env.FIREBASE_PROJECT_ID) throw new Error('Could not determine Firebase project ID');
          let releaseNotes = manifest.releaseNotes ?? manifest.whatsNew ?? manifest.features ?? [];
          if (typeof releaseNotes === 'string') releaseNotes = releaseNotes.split(/\r?\n/);
          if (!Array.isArray(releaseNotes)) releaseNotes = [];
          releaseNotes = releaseNotes.map(x => String(x ?? '').trim()).filter(Boolean).slice(0, 5).map(x => x.slice(0, 180));
          const releaseDate = String(manifest.releaseDate ?? manifest.release_date ?? new Date().toISOString().slice(0, 10));
          const title = 'تحديث جديد لتطبيق رفيق';
          const summary = releaseNotes.slice(0, 2).join(' • ');
          const body = (`الإصدار ${version} أصبح متاحًا.` + (summary ? ` الجديد: ${summary}` : ' افتح رفيق لعرض المزايا وتنزيل التحديث.')).slice(0, 240);
          const data = {
            rafeeqType: 'app-update',
            updateVersion: version,
            latestVersion: version,
            apkUrl,
            updateUrl,
            releasePageUrl: updateUrl,
            releaseDate,
            releaseNotes: JSON.stringify(releaseNotes),
            notification_title: title,
            notification_body: body,
            notification_id: `rafeeq-release-${version}`
          };
          const payload = {
            message: {
              topic: 'rafeeq_updates',
              notification: { title, body },
              data,
              android: {
                priority: 'HIGH',
                notification: { tag: 'rafeeq-app-update', sound: 'default' }
              }
            }
          };
          fs.writeFileSync('fcm-payload.json', JSON.stringify(payload));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          console.log(`Prepared release notification for Rafeeq ${version}.`);
          NODE

      - name: Verify that the published APK is reachable
        shell: bash
        run: |
          APK_URL="$(node -e "const m=require('./version.json'); process.stdout.write(String(m.apkUrl||m.directApkUrl||m.downloadUrl||''))")"
          if [ -z "$APK_URL" ]; then echo 'apkUrl is missing'; exit 1; fi
          STATUS="$(curl --location --silent --show-error --retry 3 --retry-all-errors --retry-delay 3 --output /dev/null --write-out '%{http_code}' "$APK_URL")"
          if [ "$STATUS" != "200" ]; then echo "APK URL returned HTTP $STATUS. Upload the APK asset first, then commit version.json."; exit 1; fi
          echo 'The APK URL is reachable.'

      - name: Send release notification to all subscribed Android devices
        shell: bash
        env:
          FIREBASE_PROJECT_ID: ${{ steps.project.outputs.project_id }}
          FIREBASE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          RELEASE_VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          RESPONSE="$(curl --silent --show-error --fail-with-body --request POST \
            --url "https://fcm.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/messages:send" \
            --header "Authorization: Bearer ${FIREBASE_ACCESS_TOKEN}" \
            --header 'Content-Type: application/json; charset=UTF-8' \
            --data-binary @fcm-payload.json)"
          echo "Firebase accepted the notification for Rafeeq ${RELEASE_VERSION}."
          node -e "const r=JSON.parse(process.argv[1]); if(!r.name) process.exit(1); console.log('FCM message accepted.')" "$RESPONSE"
