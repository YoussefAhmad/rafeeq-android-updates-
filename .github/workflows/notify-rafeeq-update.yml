name: Notify Rafeeq Android users about a new release 

on:
  push:
    branches:
      - main
    paths:
      - version.json
  workflow_dispatch:
    inputs:
      send_notification:
        description: 'Send a real notification to all Rafeeq subscribers'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rafeeq-android-release-notification
  cancel-in-progress: false

jobs:
  notify-devices:
    name: Validate release and notify devices
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the update manifest
        uses: actions/checkout@v7

      - name: Read Firebase project ID
        id: project
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const raw = process.env.FIREBASE_SERVICE_ACCOUNT_JSON || '';
          if (!raw) throw new Error('Missing repository secret FIREBASE_SERVICE_ACCOUNT_JSON');
          const account = JSON.parse(raw);
          if (!account.project_id) throw new Error('Missing project_id in service-account JSON');
          if (!account.client_email || !account.private_key) {
            throw new Error('Service-account JSON is incomplete');
          }
          console.log(`project_id=${account.project_id}`);
          NODE

      - name: Authenticate with Firebase
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_lifetime: 600s
          access_token_scopes: https://www.googleapis.com/auth/firebase.messaging

      - name: Validate version.json and prepare notification
        id: manifest
        shell: bash
        env:
          FIREBASE_PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('version.json', 'utf8'));
          const version = String(manifest.latestVersion ?? manifest.latest_version ?? manifest.version ?? manifest.appVersion ?? '').trim().replace(/^[vV]/, '');
          const apkUrl = String(manifest.apkUrl ?? manifest.directApkUrl ?? manifest.downloadUrl ?? '').trim();
          const updateUrl = String(manifest.updateUrl ?? manifest.releasePageUrl ?? manifest.releaseUrl ?? '').trim();

          if (!/^\d+(\.\d+){1,3}([+-][0-9A-Za-z.-]+)?$/.test(version)) throw new Error('Invalid version in version.json');
          if (!/^https:\/\//i.test(apkUrl) || !/\.apk(?:$|\?)/i.test(apkUrl)) throw new Error('apkUrl must be an HTTPS APK URL');
          if (!/^https:\/\//i.test(updateUrl)) throw new Error('updateUrl must be an HTTPS URL');
          if (!process.env.FIREBASE_PROJECT_ID) throw new Error('Firebase project ID was not found');

          let notes = manifest.releaseNotes ?? manifest.whatsNew ?? manifest.features ?? [];
          if (typeof notes === 'string') notes = notes.split(/\r?\n/);
          if (!Array.isArray(notes)) notes = [];
          notes = notes.map(x => String(x ?? '').trim()).filter(Boolean).slice(0, 5).map(x => x.slice(0, 180));

          const releaseDate = String(manifest.releaseDate ?? manifest.release_date ?? new Date().toISOString().slice(0, 10));
          const title = 'تحديث جديد لتطبيق رفيق';
          const summary = notes.slice(0, 2).join(' • ');
          const body = (`الإصدار ${version} أصبح متاحًا.` + (summary ? ` الجديد: ${summary}` : ' افتح رفيق لعرض تفاصيل التحديث.')).slice(0, 240);

          const data = {
            rafeeqType: 'app-update',
            updateVersion: version,
            latestVersion: version,
            apkUrl,
            updateUrl,
            releasePageUrl: updateUrl,
            releaseDate,
            releaseNotes: JSON.stringify(notes),
            notification_title: title,
            notification_body: body,
            notification_id: `rafeeq-release-${version}`
          };

          const payload = {
            message: {
              topic: 'rafeeq_updates',
              notification: { title, body },
              data,
              android: {
                priority: 'HIGH',
                notification: {
                  tag: `rafeeq-release-${version}`,
                  sound: 'default'
                }
              }
            }
          };

          fs.writeFileSync('fcm-payload.json', JSON.stringify(payload));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          console.log(`Prepared notification for version ${version}`);
          NODE

      - name: Verify APK is available
        shell: bash
        run: |
          APK_URL="$(node -e "const m=require('./version.json'); process.stdout.write(String(m.apkUrl||m.directApkUrl||m.downloadUrl||''))")"

          if [ -z "$APK_URL" ]; then
            echo 'apkUrl is missing'
            exit 1
          fi

          STATUS="$(curl --location --silent --show-error --retry 3 --retry-all-errors --retry-delay 3 --output /dev/null --write-out '%{http_code}' "$APK_URL")"

          if [ "$STATUS" != '200' ]; then
            echo "APK URL returned HTTP $STATUS"
            echo 'Upload the APK asset before updating version.json.'
            exit 1
          fi

          echo 'APK URL is reachable.'

      - name: Safe manual run - no notification sent
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.send_notification != 'true'
        shell: bash
        run: |
          echo 'Dry run completed. No notification was sent.'

      - name: Send update notification to subscribers
        if: github.event_name == 'push' || github.event.inputs.send_notification == 'true'
        shell: bash
        env:
          FIREBASE_PROJECT_ID: ${{ steps.project.outputs.project_id }}
          FIREBASE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          RELEASE_VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          RESPONSE="$(curl --silent --show-error --fail-with-body --request POST \
            --url "https://fcm.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/messages:send" \
            --header "Authorization: Bearer ${FIREBASE_ACCESS_TOKEN}" \
            --header 'Content-Type: application/json; charset=UTF-8' \
            --data-binary @fcm-payload.json)"

          node -e "const r=JSON.parse(process.argv[1]); if(!r.name) { console.error(JSON.stringify(r)); process.exit(1); } console.log('Firebase accepted the notification.');" "$RESPONSE"

          echo "Firebase accepted the notification for ${RELEASE_VERSION}."
